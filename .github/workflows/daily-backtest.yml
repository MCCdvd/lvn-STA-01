name: Daily Backtest

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      ticker:
        description: Optional ticker symbol override
        required: false
        type: string

jobs:
  daily-backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas numpy scipy
          fi

      - name: Run daily backtest
        id: run_backtest
        continue-on-error: true
        env:
          BACKTEST_TICKER: ${{ inputs.ticker || vars.DAILY_BACKTEST_TICKER || 'BAYN' }}
        run: |
          start_ts=$(date +%s)
          python backtest.py --ticker "$BACKTEST_TICKER" > daily_backtest.log 2>&1
          end_ts=$(date +%s)
          echo "execution_time=$((end_ts-start_ts))" >> "$GITHUB_OUTPUT"
          echo "ticker=$BACKTEST_TICKER" >> "$GITHUB_OUTPUT"

      - name: Prepare daily results file for Telegram
        id: prepare_results
        if: steps.run_backtest.outcome == 'success'
        continue-on-error: true
        env:
          BACKTEST_TICKER: ${{ steps.run_backtest.outputs.ticker }}
        run: |
          source_file="./database/single_ticker_analysis/single_run/$BACKTEST_TICKER/summary_by_ticker.csv"
          if [ ! -f "$source_file" ]; then
            echo "Expected summary file not found: $source_file" >&2
            exit 1
          fi
          cp "$source_file" backtest_results.csv

      - name: Create daily success issue
        id: create_daily_issue
        if: steps.run_backtest.outcome == 'success' && steps.prepare_results.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Daily Backtest Results - ${new Date().toISOString().slice(0,10)}`;
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `Daily backtest completed successfully for ticker: ${{ steps.run_backtest.outputs.ticker }}`,
              labels: ['backtest', 'daily', 'success']
            });
            core.setOutput('issue_url', issue.data.html_url);

      - name: Send Telegram notification
        if: steps.run_backtest.outcome == 'success' && steps.prepare_results.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DAILY_ISSUE_URL: ${{ steps.create_daily_issue.outputs.issue_url }}
        run: |
          python telegram_notifier.py notify-daily \
            --results-file backtest_results.csv \
            --execution-time "${{ steps.run_backtest.outputs.execution_time }}"

      - name: Send Telegram failure notification
        if: steps.run_backtest.outcome != 'success' || steps.prepare_results.outcome != 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_OUTCOME: ${{ steps.run_backtest.outcome }}
          PREP_OUTCOME: ${{ steps.prepare_results.outcome }}
        run: |
          if [ "$RUN_OUTCOME" != "success" ]; then
            err="$(tail -n 30 daily_backtest.log 2>/dev/null || echo 'Backtest step failed before log creation')"
          else
            err="Backtest completed but summary file for Telegram notification was not generated."
          fi
          python telegram_notifier.py notify-daily \
            --results-file backtest_results.csv \
            --status failure \
            --error "$err"

      - name: Mark workflow failed
        if: steps.run_backtest.outcome != 'success' || steps.prepare_results.outcome != 'success'
        run: exit 1
