name: Test Telegram
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test Secrets
        env:
          BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$BOT" ]; then echo "❌ BOT token missing"; exit 1; fi
          if [ -z "$CHAT" ]; then echo "❌ CHAT ID missing"; exit 1; fi
          echo "✅ Both secrets are set!"
          
          curl -X POST \
            "https://api.telegram.org/bot${BOT}/sendMessage" \
            -d "chat_id=${CHAT}" \
            -d "text=✅ Telegram test successful!"
